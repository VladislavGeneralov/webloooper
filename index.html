<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Loooooper</title>

  <style>
    /* Rack-module skin borrowed from NEWRACK (brushed-aluminum panels on a
       black chassis, flat rectangular controls, no glow/rounded corners -
       LED state changes are flat color swaps only). */
    :root {
      color-scheme: dark;

      --metal-hi: #eef0f1;
      --metal: #cacccf;
      --metal-low: #94969a;
      --panel-gradient: linear-gradient(180deg, var(--metal-hi) 0%, var(--metal) 45%, var(--metal-low) 100%);

      --black: #0d0d0e;
      --black2: #1c1d1f;
      --groove: #141416;

      --ink: #26282c;
      --ink-muted: #61656b;
      --text: #d8dadf;

      --rec-red: #b23327;
      --rec-amber: #b28a27;
      --led-green: #3ecf6e;

      /* Mobile-first sizing (same convention as kladminweb: small/compact
         values are the default, a min-width media query below scales them
         up for desktop - not the other way around). The lever here is
         control SIZE, not the space between controls: --left-panel-gap,
         --fader-row-gap, --rec-group-gap, --tiny-gap and --panel-gap (the
         gaps that read as "air" around/between knobs and faders) are the
         same at every width, on purpose - first mobile pass shrank gaps
         harder than the controls themselves, which fit the screen but
         looked cramped instead of just smaller. Knob/fader/button sizes
         shrink instead; the breathing room stays constant. */
      --left-panel-gap: 14px;
      --fader-row-gap: 14px;
      --rec-group-gap: 8px;
      --tiny-gap: 4px;
      --panel-gap: 6px;
      --toggle-dot: 5px;

      --card-pad: 8px;
      --card-gap: 8px;
      --left-col: 70px;
      --fader-w: 30px;
      --fader-h: 144px;
      --waveform-h: 42px;
      --knob-size: 30px;
      --rec-btn: 38px;
      --rec-led: 10px;
      --toggle-size: 13px;
      --players-gap: 8px;

      /* Right (fader) column width and overall card width, computed from
         the sizes above instead of measured from rendered content - grid
         `max-content` columns depend on the browser inferring an
         intrinsic size, which is exactly the kind of computed sizing
         that kept mismatching between Chrome and real Safari all
         session. calc() from known values is deterministic instead. */
      --right-col: calc(var(--fader-w) * 2 + var(--fader-row-gap));
      --card-w: calc(var(--card-pad) * 2 + var(--left-col) + var(--card-gap) + var(--right-col));
    }

    @media (min-width: 560px) {
      :root {
        --card-pad: 10px;
        --card-gap: 10px;
        --left-col: 76px;
        --fader-w: 32px;
        --fader-h: 172px;
        --waveform-h: 56px;
        --knob-size: 40px;
        --rec-btn: 48px;
        --rec-led: 13px;
        --toggle-size: 17px;
        --players-gap: 10px;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--black);
      color: var(--text);
      overflow-x: hidden;
      padding: 20px 10px;
      /* Kiosk-style lockdown (same convention as kladmineralovweb/SCDJ):
         no pinch-zoom, no swipe-back/overscroll bounce, no page panning,
         no accidental text selection or long-press callouts while playing
         on a phone. Interactive controls (knob, faders) still work - they
         handle their own drag via pointer events / native slider behavior,
         which isn't blocked by this. pan-y (not none): the grid drops to
         a single scrollable column on narrow phones (see .players below),
         so vertical scroll has to stay available - pan-y blocks pinch-zoom
         and horizontal panning while leaving that scroll as-is. */
      overscroll-behavior: none;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* Same convention as SCDJ/kladminweb: no JS measuring, no forced
       exact-fit scaling - just native CSS reflow. auto-fit lets the grid
       show 2 columns when there's room and drop to 1 column (page then
       simply scrolls vertically, same as kladminweb's stage) when there
       isn't, at any viewport width, with zero computation on our side. */
    .players {
      /* auto-fit only resolves to more than 1 track when the grid has a
         definite width to measure against - body is normal block flow
         (not flex), so this 100% resolves against its definite content
         width instead of an indefinite shrink-to-fit size. Cards are sized
         (via the --card-* variables above) to comfortably fit 2 columns
         at any real phone width, so auto-fit here is just a safety net for
         unusually narrow viewports, not the primary mobile strategy. */
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, var(--card-w));
      gap: var(--players-gap);
      justify-content: center;
    }

    /* Two-column split inside each card: left column stacks
       rec/shuffle/reverse, right column holds the fader pair. Both track
       widths are explicit (var(--left-col), var(--right-col)) rather than
       max-content, so the card's real width always matches --card-w
       exactly - a max-content column measures the row's tallest/widest
       *content*, and on real Safari that measurement came out wider than
       intended (rotated range input, knob pointer, etc.), overflowing the
       fixed-width card and throwing off centering/spacing between cards. */
    .controls {
      width: var(--card-w);
      min-width: 0;
      display: grid;
      grid-template-columns: var(--left-col) var(--right-col);
      gap: var(--card-gap);
      padding: var(--card-pad);
      border: 1px solid var(--black);
      background: var(--panel-gradient);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5), 0 16px 40px rgba(0, 0, 0, 0.5);
      color: var(--ink);
      align-items: start;
    }

    .player-title {
      grid-column: 1 / -1;
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    /* Waveform display: recessed dark "screen" set into the metal panel.
       min-width:0 overrides the grid item's default min-width:auto (which
       floors it at its content's intrinsic size) - without it, the canvas'
       intrinsic pixel buffer (set in JS to cssWidth*devicePixelRatio, which
       can be 300-450px+ on a high-DPI phone) forces this whole column - and
       every ancestor up to .controls - to grow to fit it, instead of the
       canvas shrinking to fit the column via width:100% like it's supposed
       to. */
    .waveform-panel {
      grid-column: 1 / -1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: var(--panel-gap);
    }

    canvas.waveform {
      display: block;
      width: 100%;
      max-width: 100%;
      height: var(--waveform-h);
      background: var(--groove);
      border: 1px solid var(--black);
    }

    .waveform-meta {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Live per-lane gain readout - debug aid, kept tiny/unobtrusive. One
       column per waveform quarter, so each number sits under the middle
       of the segment it belongs to. */
    .gain-debug {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      font-size: 9px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      opacity: 0.75;
    }

    .gain-debug span {
      text-align: center;
    }

    /* The rec button/knob are centered within --left-col via
       align-items:center, but --left-col is wider than that content -
       leaving visible slack before it - while the fader pair on the
       right exactly fills --right-col with none. That reads as a big
       gap before the knob and almost none after the LOW fader. Nudging
       just this row (not .player-title/.waveform-panel, which span the
       full card width and need to stay symmetric) left by the same
       amount on both sides balances it without changing the card's own
       padding or overall width. */
    .left-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: var(--left-panel-gap);
      padding-top: 4px;
      margin-left: -6px;
    }

    .right-panel {
      width: 100%;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 4px;
      margin-right: 6px;
    }

    .rec-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--rec-group-gap);
    }

    .rack-btn {
      min-width: 56px;
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--black);
      background: linear-gradient(180deg, var(--black2), var(--black));
      color: var(--text);
      font-family: inherit;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      cursor: pointer;
    }

    .rack-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Single round transport button - text swaps Rec/Stop/... instead of
       two separate buttons. Round like a real hardware transport button. */
    .rack-btn-round {
      width: var(--rec-btn);
      height: var(--rec-btn);
      min-width: 0;
      padding: 0;
      border-radius: 50%;
      font-size: 10px;
    }

    /* REC LED: flat lit/unlit color swap, no glow halo. */
    .rec-led {
      display: inline-block;
      width: var(--rec-led);
      height: var(--rec-led);
      border-radius: 50%;
      background: linear-gradient(180deg, var(--black2), var(--black));
      border: 1px solid var(--black);
      flex-shrink: 0;
    }

    .rec-led.on {
      background: var(--rec-red);
    }

    .rec-led.busy {
      background: var(--rec-amber);
    }

    .fader-row {
      display: flex;
      gap: var(--fader-row-gap);
      justify-content: center;
    }

    .fader-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--tiny-gap);
    }

    .knob-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--ink-muted);
      text-align: center;
    }

    /* Vertical mixer fader: a normal horizontal <input type=range> rotated
       -90deg inside a fixed-size wrapper, same trick as NEWRACK's mixer.
       --fader-h is picked (at each breakpoint) so the "Orig"/"Low" labels
       underneath land at the same vertical position as "Rev prob" at the
       bottom of the left column (rec-group + shuffle + knob-group stack). */
    .mixer-fader-track {
      position: relative;
      width: var(--fader-w);
      height: var(--fader-h);
    }

    .mixer-fader-track input[type="range"] {
      position: absolute;
      top: 50%;
      left: 50%;
      width: var(--fader-h);
      height: var(--fader-w);
      margin: 0;
      transform: translate(-50%, -50%) rotate(-90deg);
      touch-action: none;
    }

    /* Round toggle button (shuffle): dark housing always stays dark - only
       a small inset LED dot (::after) lights up green when on, instead of
       flooding the whole button with color. Centered via flex (not
       top/left:50% + translate(-50%)) - that transform trick computes a
       half-pixel center on this 17px (odd) box, which browsers can round
       asymmetrically. The dot is 5px, also odd, so (17-5)/2 = 6px lands
       on a whole pixel each side either way - flex centering just avoids
       relying on subpixel math to get there. */
    .mixer-toggle {
      width: var(--toggle-size);
      height: var(--toggle-size);
      border-radius: 50%;
      border: 1px solid var(--black);
      background: linear-gradient(180deg, var(--black2), var(--black));
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mixer-toggle::after {
      content: "";
      width: var(--toggle-dot);
      height: var(--toggle-dot);
      border-radius: 50%;
      background: var(--black2);
    }

    .mixer-toggle.active::after {
      background: var(--led-green);
    }

    /* Rotary knob (reverse probability) - ported from NEWRACK's makeKnob:
       vertical-drag-to-turn, --deg rotates the ::after indicator line. */
    .knob-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--tiny-gap);
    }

    .knob {
      width: var(--knob-size);
      height: var(--knob-size);
      border-radius: 50%;
      position: relative;
      cursor: ns-resize;
      touch-action: none;
      background: radial-gradient(circle at 35% 30%, var(--black2), var(--black) 70%);
      border: 1px solid var(--black);
      box-shadow: 0 4px 6px rgba(0, 0, 0, .5);
    }

    .knob::after {
      content: "";
      position: absolute;
      left: 50%;
      top: calc(var(--knob-size) * 0.1);
      width: 4px;
      height: calc(var(--knob-size) * 0.325);
      background: var(--metal-hi);
      transform-origin: 50% calc(var(--knob-size) * 0.4);
      transform: translateX(-50%) rotate(var(--deg, -135deg));
    }

    .knob-value {
      font-size: 9px;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 34px;
      background: transparent;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: repeating-linear-gradient(90deg, var(--groove), var(--groove) 2px, transparent 2px, transparent 10px), var(--groove);
      border: 1px solid var(--black);
    }

    input[type="range"]::-moz-range-track {
      height: 4px;
      background: var(--groove);
      border: 1px solid var(--black);
    }

    /* Fader cap: long axis perpendicular to travel, like a real fader cap.
       The .mixer-fader-track ancestor's rotate(-90deg) turns it sideways
       for the vertical faders; the grip-groove gradient direction is
       pre-rotated (90deg vs 180deg) so it still reads horizontal afterward. */
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 24px;
      margin-top: -10px;
      background:
        linear-gradient(180deg, transparent 44%, var(--metal-hi) 44%, var(--metal-hi) 56%, transparent 56%),
        linear-gradient(180deg, var(--black2), var(--black));
      border: 1px solid var(--black);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .6);
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 24px;
      background:
        linear-gradient(180deg, transparent 44%, var(--metal-hi) 44%, var(--metal-hi) 56%, transparent 56%),
        linear-gradient(180deg, var(--black2), var(--black));
      border: 1px solid var(--black);
      box-shadow: 0 2px 4px rgba(0, 0, 0, .6);
      cursor: pointer;
    }

    .mixer-fader-track input[type="range"]::-webkit-slider-thumb {
      background:
        linear-gradient(90deg, transparent 44%, var(--metal-hi) 44%, var(--metal-hi) 56%, transparent 56%),
        linear-gradient(180deg, var(--black2), var(--black));
    }

    .mixer-fader-track input[type="range"]::-moz-range-thumb {
      background:
        linear-gradient(90deg, transparent 44%, var(--metal-hi) 44%, var(--metal-hi) 56%, transparent 56%),
        linear-gradient(180deg, var(--black2), var(--black));
    }

  </style>
</head>

<body>

  <template id="player-template">
    <div class="controls">
      <div class="player-title" data-role="player-title"></div>

      <div class="waveform-panel">
        <canvas class="waveform" data-role="waveform" width="320" height="112"></canvas>
        <div class="gain-debug" data-role="gainDebug">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="waveform-meta" data-role="durationLabel">Ready to record</div>
      </div>

      <div class="left-panel">
        <div class="rec-group">
          <span class="rec-led" data-role="recLed"></span>
          <button class="rack-btn rack-btn-round" data-role="recStop" type="button">Rec</button>
        </div>

        <div class="fader-col">
          <button class="mixer-toggle" data-role="shuffle" type="button"></button>
          <div class="knob-label">Shuffle</div>
        </div>

        <div class="knob-group">
          <div class="knob" data-role="reverseProbabilityKnob"></div>
          <span class="knob-label">Rev prob</span>
          <span class="knob-value"></span>
        </div>
      </div>

      <div class="right-panel">
        <div class="fader-row">
          <div class="fader-col">
            <div class="mixer-fader-track">
              <input data-role="volumeOriginal" type="range" min="0" max="8" step="0.01" value="4" />
            </div>
            <div class="knob-label">Orig</div>
            <span class="knob-value" data-role="volumeOriginalValue">50%</span>
          </div>

          <div class="fader-col">
            <div class="mixer-fader-track">
              <input data-role="volumeOctave" type="range" min="0" max="8" step="0.01" value="0" />
            </div>
            <div class="knob-label">Low</div>
            <span class="knob-value" data-role="volumeOctaveValue">0%</span>
          </div>
        </div>
      </div>
    </div>
  </template>

  <div id="players" class="players"></div>

  <script src="main.js"></script>

</body>
</html>
